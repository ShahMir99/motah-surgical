    <circle cx="500" cy="245" r="16" fill="none" stroke="#18B27F" stroke-width="7"/>
    <path d="M270 360 L340 390" stroke="#0B1119" stroke-opacity="0.7" stroke-width="8"/>
    <path d="M470 370 L540 400" stroke="#18B27F" stroke-width="8"/>
