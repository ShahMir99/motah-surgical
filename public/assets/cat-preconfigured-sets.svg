<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="setsTitle">
  <title id="setsTitle">Pre-configured surgical instrument set tray</title>
  <defs>
    <linearGradient id="setsPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F7"/>
      <stop offset="100%" stop-color="#EDF9F5"/>
    </linearGradient>
    <linearGradient id="setsSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C8891"/>
      <stop offset="100%" stop-color="#18B27F"/>
