  <rect x="180" y="560" width="1240" height="220" rx="24" fill="url(#trayMetal)" stroke="#3B4652" stroke-width="2"/>
  <rect x="210" y="586" width="1180" height="168" rx="16" fill="#0B1119" stroke="#18B27F" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="180" y="558" width="1240" height="4" fill="url(#passivationSweep)"/>

  <g transform="translate(320,610) rotate(-8)">
