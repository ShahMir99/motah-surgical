<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Precision surgical instruments arranged on a sterile steel tray</title>
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1119"/>
      <stop offset="55%" stop-color="#0F1B22"/>
      <stop offset="100%" stop-color="#12915F"/>
    </linearGradient>
    <linearGradient id="passivationSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C8891"/>
      <stop offset="55%" stop-color="#18B27F"/>
      <stop offset="100%" stop-color="#80D5B9"/>
    </linearGradient>
    <linearGradient id="trayMetal" x1="0%" y1="0%" x2="0%" y2="100%">
